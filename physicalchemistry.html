body{

/* floating chemistry shapes */

.shape{
position:absolute;
font-size:70px;
opacity:0.55;
z-index:-1;
animation:float 12s infinite ease-in-out;
}

.red{color:#ff4d4d;}
.yellow{color:#ffd54f;}
.green{color:#4caf50;}
.purple{color:#9c27b0;}

.s1{top:120px;left:120px;}
.s2{top:260px;right:180px;}
.s3{top:450px;left:250px;}
.s4{bottom:200px;right:200px;}
.s5{top:100px;right:80px;}
.s6{bottom:120px;left:80px;}
.s7{top:520px;right:60px;}

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-50px);}
100%{transform:translateY(0);}
}

/* header */

.header{
text-align:center;
padding:70px 20px 30px 20px;
}

.header h1{
font-size:44px;
color:#222;
}

.header p{
font-size:20px;
margin-top:10px;
}

/* chapters */

.chapters{
padding:40px 8% 80px 8%;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
margin-top:30px;
}

.chapter{
background:white;
padding:25px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
transition:0.3s;
}

.chapter:hover{
transform:translateY(-10px) scale(1.05);
}

.chapter h3{
font-size:20px;
margin-bottom:12px;
}

/* glowing button */

.btn{
display:inline-block;
padding:10px 20px;
border-radius:20px;
background:#00c853;
color:white;
text-decoration:none;
box-shadow:0 0 10px #00c853,0 0 25px #00c853;
transition:0.3s;
margin:5px;
border:none;
cursor:pointer;
}

.btn:hover{
transform:scale(1.08);
box-shadow:0 0 20px #00c853,0 0 40px #00c853;
}

/* lecture list container */

.lectureBox{
margin-top:15px;
display:none;
}

.back{
text-align:center;
margin-top:40px;
}

.back a{
text-decoration:none;
padding:14px 30px;
background:#ff7675;
color:white;
border-radius:30px;
box-shadow:0 0 10px #ff7675;
}

/* Dynamic Modal Box CSS */

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(5px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}

.modal-card {
  background: #ffffff;
  padding: 30px;
  border-radius: 20px;
  text-align: center;
  width: 90%;
  max-width: 380px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.3);
  transform: scale(0.7);
  transition: transform 0.3s ease;
  position: relative;
}

.modal-overlay.active .modal-card {
  transform: scale(1);
}

.modal-card h3 {
  color: #222;
  margin-bottom: 5px;
  font-size: 22px;
}

.modal-card p.caption {
  color: #666;
  font-size: 15px;
  margin-bottom: 20px;
  font-weight: 400;
}

.modal-buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 15px;
}

.modal-btn {
  padding: 12px 24px;
  border-radius: 25px;
  border: none;
  color: white;
  font-weight: 600;
  text-decoration: none;
  font-size: 15px;
  cursor: pointer;
  transition: 0.3s;
}

.modal-btn-lec {
  background: #00c853;
  box-shadow: 0 4px 15px rgba(0, 200, 83, 0.4);
}

.modal-btn-lec:hover {
  transform: translateY(-2px);

}

.modal-btn-notes {

}

.modal-btn-notes:hover {
  transform: translateY(-2px);

.close-modal {

  right: 18px;
  font-size: 22px;
  color: #aaa;
  cursor: pointer;
  font-weight: bold;
}

.close-modal:hover {

function toggleChapter(ch, btn) {
  let chapter = btn.parentElement;
  let box = chapter.querySelector(".lectureBox");

  if (box.style.display === "block") {
    box.style.display = "none";
    btn.innerText = "Open";
    return;
  }

  document.querySelectorAll(".lectureBox").forEach(b => b.style.display = "none");
  document.querySelectorAll(".toggleBtn").forEach(b => b.innerText = "Open");

  box.innerHTML = "";

  if (lectures[ch]) {
    lectures[ch].forEach((item, i) => {
      box.innerHTML += `
        <button class="btn" onclick="openModal(${ch}, ${i})">
          Lecture ${i + 1}
        </button>
      `;
    });
  }

  box.style.display = "block";
  btn.innerText = "Close";
}

function openModal(ch, index) {
  let item = lectures[ch][index];
  document.getElementById("modalTitle").innerText = `Lecture ${index + 1}`;
  document.getElementById("modalCaption").innerText = item.title || "No Caption Available";
  document.getElementById("lectureLink").href = item.lec || "#";
  document.getElementById("notesLink").href = item.notes || "#";

  document.getElementById("optionModal").classList.add("active");
}

function closeModal() {
  document.getElementById("optionModal").classList.remove("active");
}

window.onclick = function(event) {
  let modal = document.getElementById("optionModal");
  if (event.target == modal) {
    closeModal();
  }
}

</script>

</body>
</html>
