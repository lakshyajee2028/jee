<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physical Chemistry</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ── RESET & BASE ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b1a2e, #1a3a5c, #0d2b44);
            overflow-x: hidden;
            position: relative;
            padding-bottom: 40px;
        }

        /* ── ANIMATED BACKGROUND PARTICLES ── */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-particles span {
            position: absolute;
            display: block;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            animation: drift linear infinite;
        }

        .bg-particles span:nth-child(1) {
            left: 10%;
            animation-duration: 18s;
            animation-delay: 0s;
            width: 10px;
            height: 10px;
        }
        .bg-particles span:nth-child(2) {
            left: 20%;
            animation-duration: 22s;
            animation-delay: 2s;
            width: 5px;
            height: 5px;
        }
        .bg-particles span:nth-child(3) {
            left: 30%;
            animation-duration: 20s;
            animation-delay: 4s;
            width: 12px;
            height: 12px;
        }
        .bg-particles span:nth-child(4) {
            left: 45%;
            animation-duration: 25s;
            animation-delay: 1s;
            width: 7px;
            height: 7px;
        }
        .bg-particles span:nth-child(5) {
            left: 55%;
            animation-duration: 19s;
            animation-delay: 3s;
            width: 9px;
            height: 9px;
        }
        .bg-particles span:nth-child(6) {
            left: 68%;
            animation-duration: 23s;
            animation-delay: 0.5s;
            width: 6px;
            height: 6px;
        }
        .bg-particles span:nth-child(7) {
            left: 78%;
            animation-duration: 21s;
            animation-delay: 5s;
            width: 11px;
            height: 11px;
        }
        .bg-particles span:nth-child(8) {
            left: 88%;
            animation-duration: 24s;
            animation-delay: 2.5s;
            width: 8px;
            height: 8px;
        }
        .bg-particles span:nth-child(9) {
            left: 92%;
            animation-duration: 17s;
            animation-delay: 3.5s;
            width: 4px;
            height: 4px;
        }
        .bg-particles span:nth-child(10) {
            left: 50%;
            animation-duration: 26s;
            animation-delay: 6s;
            width: 14px;
            height: 14px;
        }

        @keyframes drift {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ── FLOATING SHAPES (original preserved) ── */
        .shape {
            position: absolute;
            font-size: 70px;
            opacity: 0.30;
            z-index: 0;
            animation: float 12s infinite ease-in-out;
            pointer-events: none;
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.05));
        }

        .red {
            color: #ff6b6b;
        }
        .yellow {
            color: #ffd93d;
        }
        .green {
            color: #6bcb77;
        }
        .purple {
            color: #a66cff;
        }

        .s1 {
            top: 120px;
            left: 120px;
        }
        .s2 {
            top: 260px;
            right: 180px;
        }
        .s3 {
            top: 450px;
            left: 250px;
        }
        .s4 {
            bottom: 200px;
            right: 200px;
        }
        .s5 {
            top: 100px;
            right: 80px;
        }
        .s6 {
            bottom: 120px;
            left: 80px;
        }
        .s7 {
            top: 520px;
            right: 60px;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
            33% {
                transform: translateY(-35px) rotate(8deg) scale(1.05);
            }
            66% {
                transform: translateY(15px) rotate(-5deg) scale(0.95);
            }
            100% {
                transform: translateY(0) rotate(0deg) scale(1);
            }
        }

        /* ── GLOW ORB (decorative) ── */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbPulse 8s ease-in-out infinite alternate;
        }

        .glow-orb.orb1 {
            width: 400px;
            height: 400px;
            top: -150px;
            right: -100px;
            background: rgba(100, 200, 255, 0.12);
        }

        .glow-orb.orb2 {
            width: 500px;
            height: 500px;
            bottom: -200px;
            left: -150px;
            background: rgba(160, 100, 255, 0.10);
            animation-delay: 4s;
        }

        @keyframes orbPulse {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* ── HEADER ── */
        .header {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 70px 20px 30px 20px;
        }

        .header h1 {
            font-size: 52px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }

        .header h1 .emoji {
            display: inline-block;
            animation: emojiFloat 3s ease-in-out infinite;
        }

        @keyframes emojiFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .header p {
            font-size: 20px;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 400;
            letter-spacing: 1px;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
        }

        .header .underline {
            display: inline-block;
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, #00c853, #29b6f6);
            border-radius: 10px;
            margin-top: 14px;
            box-shadow: 0 0 30px rgba(0, 200, 83, 0.3);
        }

        /* ── CHAPTERS GRID ── */
        .chapters {
            position: relative;
            z-index: 1;
            padding: 30px 8% 60px 8%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 28px;
            margin-top: 30px;
        }

        /* ── CHAPTER CARD ── */
        .chapter {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 24px;
            padding: 28px 20px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .chapter::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent 60%);
            border-radius: 24px;
            pointer-events: none;
        }

        .chapter:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.4), 0 0 40px rgba(0, 200, 83, 0.05);
        }

        .chapter .icon-wrap {
            font-size: 38px;
            margin-bottom: 10px;
            display: block;
            filter: drop-shadow(0 4px 20px rgba(255, 255, 255, 0.05));
        }

        .chapter h3 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: 0.3px;
            position: relative;
            z-index: 1;
        }

        .chapter .btn {
            display: inline-block;
            padding: 10px 28px;
            border-radius: 30px;
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 200, 83, 0.35);
            position: relative;
            z-index: 1;
            letter-spacing: 0.3px;
        }

        .chapter .btn:hover {
            transform: scale(1.07);
            box-shadow: 0 6px 35px rgba(0, 200, 83, 0.55), 0 0 60px rgba(0, 200, 83, 0.15);
        }

        .chapter .btn:active {
            transform: scale(0.95);
        }

        /* ── LECTURE BOX ── */
        .lectureBox {
            margin-top: 18px;
            display: none;
            animation: fadeSlide 0.4s ease;
            position: relative;
            z-index: 1;
        }

        @keyframes fadeSlide {
            0% {
                opacity: 0;
                transform: translateY(-10px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .lectureBox .btn {
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            padding: 8px 18px;
            font-size: 13px;
            margin: 5px 4px;
            border-radius: 30px;
            color: #fff;
            font-weight: 500;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.06);
        }

        .lectureBox .btn:hover {
            background: rgba(41, 182, 246, 0.25);
            border-color: rgba(41, 182, 246, 0.4);
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 8px 30px rgba(41, 182, 246, 0.15);
        }

        /* ── BACK BUTTON ── */
        .back {
            text-align: center;
            margin-top: 50px;
            position: relative;
            z-index: 1;
        }

        .back a {
            text-decoration: none;
            padding: 14px 34px;
            background: rgba(255, 118, 117, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 118, 117, 0.20);
            color: #ffb3b3;
            border-radius: 40px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
            font-size: 16px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .back a:hover {
            background: rgba(255, 118, 117, 0.25);
            border-color: rgba(255, 118, 117, 0.4);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 40px rgba(255, 118, 117, 0.15);
            color: #fff;
        }

        /* ── MODAL ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 36px 32px 32px;
            border-radius: 28px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            transform: scale(0.8) translateY(30px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-card .close-modal {
            position: absolute;
            top: 14px;
            right: 20px;
            font-size: 26px;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-weight: 400;
            transition: all 0.3s ease;
            line-height: 1;
        }

        .modal-card .close-modal:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        .modal-card .modal-icon {
            font-size: 44px;
            margin-bottom: 6px;
            display: block;
        }

        .modal-card h3 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }

        .modal-card .caption {
            color: rgba(255, 255, 255, 0.60);
            font-size: 15px;
            font-weight: 400;
            margin-bottom: 22px;
            line-height: 1.5;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 13px 30px;
            border-radius: 40px;
            border: none;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1 1 auto;
            min-width: 120px;
            letter-spacing: 0.3px;
        }

        .modal-btn-lec {
            background: linear-gradient(135deg, #00c853, #00e676);
            box-shadow: 0 4px 25px rgba(0, 200, 83, 0.35);
        }

        .modal-btn-lec:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 8px 40px rgba(0, 200, 83, 0.5);
        }

        .modal-btn-notes {
            background: linear-gradient(135deg, #29b6f6, #4fc3f7);
            box-shadow: 0 4px 25px rgba(41, 182, 246, 0.35);
        }

        .modal-btn-notes:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 8px 40px rgba(41, 182, 246, 0.5);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 34px;
            }
            .header p {
                font-size: 17px;
            }
            .grid {
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 18px;
            }
            .chapters {
                padding: 20px 5% 40px 5%;
            }
            .chapter {
                padding: 20px 14px 18px;
            }
            .chapter h3 {
                font-size: 17px;
            }
            .shape {
                font-size: 44px;
                opacity: 0.20;
            }
            .s1 {
                top: 80px;
                left: 20px;
            }
            .s2 {
                top: 180px;
                right: 20px;
            }
            .s3 {
                top: 350px;
                left: 30px;
            }
            .s4 {
                bottom: 140px;
                right: 30px;
            }
            .s5 {
                top: 60px;
                right: 10px;
            }
            .s6 {
                bottom: 80px;
                left: 10px;
            }
            .s7 {
                top: 420px;
                right: 10px;
            }
            .modal-card {
                padding: 28px 20px 24px;
                max-width: 340px;
            }
            .modal-card h3 {
                font-size: 20px;
            }
            .modal-btn {
                padding: 11px 20px;
                font-size: 14px;
                min-width: 90px;
            }
            .back a {
                padding: 12px 24px;
                font-size: 14px;
            }
            .glow-orb.orb1 {
                width: 200px;
                height: 200px;
                top: -80px;
                right: -60px;
            }
            .glow-orb.orb2 {
                width: 260px;
                height: 260px;
                bottom: -100px;
                left: -80px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 26px;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .chapter {
                padding: 16px 10px 14px;
                border-radius: 18px;
            }
            .chapter h3 {
                font-size: 14px;
            }
            .chapter .btn {
                padding: 7px 16px;
                font-size: 12px;
            }
            .chapter .icon-wrap {
                font-size: 28px;
            }
            .lectureBox .btn {
                font-size: 11px;
                padding: 6px 12px;
                margin: 3px 3px;
            }
            .modal-card {
                padding: 22px 16px 20px;
                max-width: 300px;
            }
            .modal-card h3 {
                font-size: 18px;
            }
            .modal-card .caption {
                font-size: 13px;
            }
            .modal-btn {
                padding: 10px 16px;
                font-size: 13px;
                min-width: 70px;
            }
            .shape {
                font-size: 30px;
            }
        }
    </style>
</head>

        // ─── TOGGLE CHAPTER ───
        function toggleChapter(ch, btn) {
            let chapter = btn.parentElement;
            let box = chapter.querySelector(".lectureBox");

            if (box.style.display === "block") {
                box.style.display = "none";
                btn.innerText = "Open";
                return;
            }

            document.querySelectorAll(".lectureBox").forEach(b => b.style.display = "none");
            document.querySelectorAll(".toggleBtn").forEach(b => b.innerText = "Open");

            box.innerHTML = "";

            if (lectures[ch]) {
                lectures[ch].forEach((item, i) => {
                    box.innerHTML += `
                        <button class="btn" onclick="openModal(${ch}, ${i})">
                            Lecture ${i + 1}
                        </button>
                    `;
                });
            }

            box.style.display = "block";
            btn.innerText = "Close";
        }

        // ─── OPEN MODAL ───
        function openModal(ch, index) {
            let item = lectures[ch][index];
            document.getElementById("modalTitle").innerText = `Lecture ${index + 1}`;
            document.getElementById("modalCaption").innerText = item.title || "No Caption Available";
            document.getElementById("lectureLink").href = item.lec || "#";
            document.getElementById("notesLink").href = item.notes || "#";

            document.getElementById("optionModal").classList.add("active");
        }

        // ─── CLOSE MODAL ───
        function closeModal() {
            document.getElementById("optionModal").classList.remove("active");
        }

        // ─── CLOSE ON OVERLAY CLICK ───
        window.onclick = function(event) {
            let modal = document.getElementById("optionModal");
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
