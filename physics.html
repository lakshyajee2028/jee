<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚗ Physical Chemistry · Lectures</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Fredoka', sans-serif;
}

body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}

/* moving circles */
.shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.35;
    z-index: -1;
    animation: move 10s infinite alternate ease-in-out;
}

.shape1 {
    width: 200px;
    height: 200px;
    background: #ffcc00;
    top: 100px;
    left: 40px;
}

.shape2 {
    width: 250px;
    height: 250px;
    background: #00e5ff;
    top: 350px;
    right: 60px;
}

.shape3 {
    width: 160px;
    height: 160px;
    background: #ff5ef7;
    bottom: 150px;
    left: 100px;
}

@keyframes move {
    0% { transform: translate(0, 0); }
    50% { transform: translate(40px, -40px); }
    100% { transform: translate(-30px, 30px); }
}

/* header */
.header {
    text-align: center;
    padding: 60px 20px 30px 20px;
}

.header h1 {
    font-size: 44px;
    color: #222;
}

.header p {
    font-size: 20px;
    margin-top: 10px;
}

/* grid */
.chapters {
    padding: 40px 8% 80px 8%;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    margin-top: 30px;
}

/* chapter card */
.chapter {
    background: white;
    padding: 25px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    transition: 0.3s;
}

.chapter:hover {
    transform: translateY(-10px) scale(1.05);
}

.chapter h3 {
    font-size: 20px;
    margin-bottom: 12px;
}

/* button */
.btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 20px;
    background: #6c5ce7;
    color: white;
    text-decoration: none;
    box-shadow: 0 0 10px #6c5ce7, 0 0 25px #6c5ce7;
    transition: 0.3s;
    margin: 5px;
    border: none;
    cursor: pointer;
    font-size: 14px;
}

.btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 20px #6c5ce7, 0 0 40px #6c5ce7;
}

/* lecture list */
.lectureBox {
    margin-top: 15px;
    display: none;
}

/* lecture row & completion toggle */
.lecture-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 6px 0;
    flex-wrap: wrap;
}

.completion-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2.5px solid rgba(108, 92, 231, 0.4);
    background: transparent;
    color: transparent;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    flex-shrink: 0;
    user-select: none;
    background: rgba(255, 255, 255, 0.1);
}

.completion-toggle:hover {
    border-color: #6c5ce7;
    transform: scale(1.1);
    background: rgba(108, 92, 231, 0.1);
}

.completion-toggle.completed {
    border-color: #00b894;
    background: rgba(0, 184, 148, 0.2);
    color: #00b894;
    box-shadow: 0 0 12px rgba(0, 184, 148, 0.3);
}

.completion-toggle.completed:hover {
    background: rgba(0, 184, 148, 0.3);
    box-shadow: 0 0 20px rgba(0, 184, 148, 0.4);
}

/* back */
.back {
    text-align: center;
    margin-top: 40px;
}

.back a {
    text-decoration: none;
    padding: 14px 30px;
    background: #ff7675;
    color: white;
    border-radius: 30px;
    box-shadow: 0 0 10px #ff7675;
    transition: 0.3s;
}

.back a:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #ff7675;
}

/* Modal */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

.modal-overlay.active {
    opacity: 1;
    visibility: visible;
}

.modal-card {
    background: #ffffff;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 90%;
    max-width: 380px;
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
    transform: scale(0.7);
    transition: transform 0.3s ease;
    position: relative;
}

.modal-overlay.active .modal-card {
    transform: scale(1);
}

.modal-card h3 {
    color: #222;
    margin-bottom: 5px;
    font-size: 22px;
}

.modal-card p.caption {
    color: #666;
    font-size: 15px;
    margin-bottom: 20px;
    font-weight: 400;
}

.modal-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 15px;
}

.modal-btn {
    padding: 12px 24px;
    border-radius: 25px;
    border: none;
    color: white;
    font-weight: 600;
    text-decoration: none;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.modal-btn-lec {
    background: #6c5ce7;
    box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
}

.modal-btn-lec:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
}

.modal-btn-notes {
    background: #00b894;
    box-shadow: 0 4px 15px rgba(0, 184, 148, 0.4);
}

.modal-btn-notes:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 184, 148, 0.6);
}

.close-modal {
    position: absolute;
    top: 12px;
    right: 18px;
    font-size: 22px;
    color: #aaa;
    cursor: pointer;
    font-weight: bold;
}

.close-modal:hover {
    color: #222;
}

@media (max-width: 600px) {
    .header h1 { font-size: 30px; }
    .grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; }
    .chapter { padding: 18px; }
    .chapter h3 { font-size: 16px; }
    .btn { padding: 7px 14px; font-size: 12px; }
}
</style>
</head>

// ─── COMPLETION STORAGE ───
function getCompletionKey(ch, idx) {
    return `pc_lec_${ch}_${idx}`;
}

function isLectureCompleted(ch, idx) {
    return localStorage.getItem(getCompletionKey(ch, idx)) === 'true';
}

function toggleCompletion(ch, idx) {
    const key = getCompletionKey(ch, idx);
    const current = localStorage.getItem(key) === 'true';
    const newState = !current;
    localStorage.setItem(key, newState ? 'true' : 'false');
    const toggle = document.querySelector(`.completion-toggle[data-ch="${ch}"][data-idx="${idx}"]`);
    if (toggle) updateToggleUI(toggle, newState);
}

function updateToggleUI(toggle, completed) {
    if (completed) {
        toggle.classList.add('completed');
        toggle.textContent = '✓';
    } else {
        toggle.classList.remove('completed');

// ─── TOGGLE CHAPTER ───
function toggleChapter(ch, btn) {
    let chapter = btn.parentElement;
    let box = chapter.querySelector(".lectureBox");

    if (box.style.display === "block") {
        box.style.display = "none";
        btn.innerText = "Open";
        return;
    }

    document.querySelectorAll(".lectureBox").forEach(b => b.style.display = "none");
    document.querySelectorAll(".toggleBtn").forEach(b => b.innerText = "Open");

    box.innerHTML = "";

    if (lectures[ch]) {
        lectures[ch].forEach((item, i) => {
            const completed = isLectureCompleted(ch, i);
            const row = document.createElement('div');
            row.className = 'lecture-row';

            const lecBtn = document.createElement('button');
            lecBtn.className = 'btn';
            lecBtn.textContent = `Lecture ${i + 1}`;
            lecBtn.onclick = (function(c, idx) {
                return function() { openModal(c, idx); };
            })(ch, i);

            const toggle = document.createElement('span');
            toggle.className = 'completion-toggle';
            toggle.dataset.ch = ch;
            toggle.dataset.idx = i;
            toggle.onclick = (function(c, idx) {
                return function() { toggleCompletion(c, idx); };
            })(ch, i);
            updateToggleUI(toggle, completed);

            row.appendChild(lecBtn);
            row.appendChild(toggle);
            box.appendChild(row);
        });
    }

    box.style.display = "block";
    btn.innerText = "Close";
}

// ─── MODAL ───
function openModal(ch, index) {
    let item = lectures[ch][index];
    document.getElementById("modalTitle").innerText = `Lecture ${index + 1}`;
    document.getElementById("modalCaption").innerText = item.title || "No Caption Available";
    document.getElementById("lectureLink").href = item.lec || "#";
    document.getElementById("notesLink").href = item.notes || "#";
    document.getElementById("optionModal").classList.add("active");
}

function closeModal() {
    document.getElementById("optionModal").classList.remove("active");
}

window.onclick = function(event) {
    let modal = document.getElementById("optionModal");
    if (event.target == modal) closeModal();
};
