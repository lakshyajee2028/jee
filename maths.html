<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif;}

body{
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
min-height:100vh;
}

/* header */

.header{text-align:center;padding:50px 20px 20px;}

.header h1{font-size:42px;}

.searchBox{text-align:center;margin-top:20px;}

.searchBox input{
padding:12px;
width:300px;
border-radius:25px;
border:none;
outline:none;
font-size:16px;
}

/* grid */

.chapters{padding:40px 8%;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:25px;
}

.chapter{
background:white;
padding:25px;
border-radius:18px;
text-align:center;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.progressText{font-size:14px;margin-bottom:10px;}

.progressBar{
height:8px;
background:#eee;
border-radius:10px;
margin-bottom:10px;
overflow:hidden;
}

.progressFill{
height:100%;
background:#00b894;
width:0%;
}

/* buttons */

.btn{
padding:10px 20px;
border:none;
border-radius:20px;
background:#6c5ce7;
color:white;
cursor:pointer;
}

.lecture-list{
display:none;
margin-top:15px;
}

/* ─── LECTURE ROW (NEW) ─── */
.lecture-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 6px 0;
    padding: 4px 6px;
    border-radius: 10px;
    background: rgba(0,0,0,0.02);
}

.lecture-row .lecture-btn {
    display: inline-block;
    flex: 1;
    margin: 0;
    padding: 8px 12px;
    background: #0984e3;
    color: white;
    border-radius: 10px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
    text-align: left;
    font-family: 'Fredoka', sans-serif;
    transition: 0.2s;
}

.lecture-row .lecture-btn:hover {
    transform: scale(1.02);
    opacity: 0.9;
}

/* ─── COMPLETION TOGGLE ─── */
.completion-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2.5px solid rgba(108, 92, 231, 0.4);
    background: transparent;
    color: transparent;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    flex-shrink: 0;
    user-select: none;
    background: rgba(255,255,255,0.1);
}

.completion-toggle:hover {
    border-color: #6c5ce7;
    transform: scale(1.1);
    background: rgba(108, 92, 231, 0.1);
}

.completion-toggle.completed {
    border-color: #00b894;
    background: rgba(0, 184, 148, 0.2);
    color: #00b894;
    box-shadow: 0 0 12px rgba(0, 184, 148, 0.3);
}

.completion-toggle.completed:hover {
    background: rgba(0, 184, 148, 0.3);
    box-shadow: 0 0 20px rgba(0, 184, 148, 0.4);
}

/* ─── MODAL ─── */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(5px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
}

.modal-overlay.active {
    opacity: 1;
    visibility: visible;
}

.modal-card {
    background: #ffffff;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 90%;
    max-width: 380px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    transform: scale(0.7);
    transition: transform 0.3s ease;
    position: relative;
}

.modal-overlay.active .modal-card {
    transform: scale(1);
}

.modal-card h3 {
    color: #222;
    margin-bottom: 5px;
    font-size: 22px;
}

.modal-card p.caption {
    color: #666;
    font-size: 15px;
    margin-bottom: 20px;
    font-weight: 400;
}

.modal-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 15px;
}

.modal-btn {
    padding: 12px 24px;
    border-radius: 25px;
    border: none;
    color: white;
    font-weight: 600;
    text-decoration: none;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

.modal-btn-lec {
    background: #6c5ce7;
    box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
}

.modal-btn-lec:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(108, 92, 231, 0.6);
}

.modal-btn-notes {
    background: #00b894;
    box-shadow: 0 4px 15px rgba(0, 184, 148, 0.4);
}

.modal-btn-notes:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0, 184, 148, 0.6);
}

.close-modal {
    position: absolute;
    top: 12px;
    right: 18px;
    font-size: 22px;
    color: #aaa;
    cursor: pointer;
    font-weight: bold;
}

.close-modal:hover {
    color: #222;
}

.back{text-align:center;margin-top:40px;}

.back a{
text-decoration:none;
padding:12px 25px;
background:#ff7675;
color:white;
border-radius:30px;
}

</style>
</head>

/* ===== NOTES/PDF PLACEHOLDER (USER CAN ADD MANUALLY) ===== */
const notesLinks = lectureLinks.map(chapterLinks => chapterLinks.map(() => '#'));

/* ======================================================== */

const grid=document.getElementById("chapterGrid");
let openChapter=null;

/* ─── TOGGLE COMPLETION ─── */
function toggleCompletion(ch, idx) {
    let key = `lec_${ch}_${idx+1}`;  // 1-based storage
    let current = localStorage.getItem(key) === '1';
    let newState = !current;
    if (newState) {
        localStorage.setItem(key, '1');
    } else {
        localStorage.removeItem(key);
    }
    updateToggleUI(ch, idx, newState);
    updateProgress(ch);
}

function updateToggleUI(ch, idx, completed) {
    let toggle = document.querySelector(`.completion-toggle[data-ch="${ch}"][data-idx="${idx}"]`);
    if (toggle) {
        if (completed) {
            toggle.classList.add('completed');
            toggle.textContent = '✓';
        } else {
            toggle.classList.remove('completed');
            toggle.textContent = '';
        }
    }
}

/* ─── INITIAL LOAD: SYNC UI WITH STORAGE ─── */
function syncAllToggles() {
    chapterNames.forEach((_, ch) => {
        let total = lectureCounts[ch];
        for (let i = 0; i < total; i++) {
            let key = `lec_${ch}_${i+1}`;
            let completed = localStorage.getItem(key) === '1';
            let toggle = document.querySelector(`.completion-toggle[data-ch="${ch}"][data-idx="${i}"]`);
            if (toggle) {
                if (completed) {
                    toggle.classList.add('completed');
                    toggle.textContent = '✓';
                } else {
                    toggle.classList.remove('completed');
                    toggle.textContent = '';
                }
            }
        }
    });
}

/* ─── UPDATE PROGRESS ─── */
function updateProgress(ch) {
    let total = lectureCounts[ch];
    let done = 0;
    for (let i = 1; i <= total; i++) {
        if (localStorage.getItem(`lec_${ch}_${i}`) === '1') done++;
    }
    let percent = Math.floor((done / total) * 100);
    let textEl = document.getElementById("text"+ch);
    let fillEl = document.getElementById("progress"+ch);
    if (textEl) textEl.innerText = "Progress: " + percent + "%";
    if (fillEl) fillEl.style.width = percent + "%";
}

/* ─── MODAL ─── */
function openModal(ch, idx) {
    let link = lectureLinks[ch][idx] || '#';
    let noteLink = notesLinks[ch][idx] || '#';
    document.getElementById("modalTitle").innerText = `Lecture ${idx+1}`;
    document.getElementById("modalCaption").innerText = chapterNames[ch] + " · Lecture " + (idx+1);
    document.getElementById("lectureLink").href = link;
    document.getElementById("notesLink").href = noteLink;
    document.getElementById("optionModal").classList.add("active");
}

function closeModal() {
    document.getElementById("optionModal").classList.remove("active");
}

window.onclick = function(event) {
    let modal = document.getElementById("optionModal");
    if (event.target == modal) closeModal();
}

/* ─── TOGGLE CHAPTER ─── */
function toggleChapter(i) {
    let list = document.getElementById("list"+i);
    let btn = document.getElementById("btn"+i);
    if (openChapter !== null && openChapter !== i) {
        document.getElementById("list"+openChapter).style.display = "none";
        document.getElementById("btn"+openChapter).innerText = "Open";
    }
    if (list.style.display === "block") {
        list.style.display = "none";
        btn.innerText = "Open";
        openChapter = null;
    } else {
        list.style.display = "block";
        btn.innerText = "Close";
        openChapter = i;
    }
}

/* ─── BUILD GRID ─── */
chapterNames.forEach((name, index) => {
    let chapter = document.createElement("div");
    chapter.className = "chapter";
    chapter.dataset.name = name.toLowerCase();

    let btnId = "btn"+index;
    let listId = "list"+index;
    let progressId = "progress"+index;

    chapter.innerHTML = `
        <h3>${name}</h3>
        <div class="progressText" id="text${index}">Progress: 0%</div>
        <div class="progressBar">
            <div class="progressFill" id="${progressId}"></div>
        </div>
        <button class="btn" id="${btnId}" onclick="toggleChapter(${index})">Open</button>
        <div class="lecture-list" id="${listId}"></div>
    `;

    grid.appendChild(chapter);

    let list = document.getElementById(listId);

    for (let i = 0; i < lectureCounts[index]; i++) {
        let row = document.createElement("div");
        row.className = "lecture-row";

        let btn = document.createElement("button");
        btn.className = "btn lecture-btn";
        btn.innerText = "Lecture " + (i+1);
        btn.onclick = (function(ch, idx) {
            return function() { openModal(ch, idx); };
        })(index, i);

        let toggle = document.createElement("span");
        toggle.className = "completion-toggle";
        toggle.dataset.ch = index;
        toggle.dataset.idx = i;
        toggle.onclick = (function(ch, idx) {
            return function(e) {
                e.stopPropagation();
                toggleCompletion(ch, idx);
            };
        })(index, i);

        row.appendChild(btn);
        row.appendChild(toggle);
        list.appendChild(row);
    }

    updateProgress(index);
});

/* ─── SEARCH ─── */
document.getElementById("searchInput").addEventListener("keyup", function() {
    let value = this.value.toLowerCase();
    document.querySelectorAll(".chapter").forEach(ch => {
        let name = ch.dataset.name;
        ch.style.display = name.includes(value) ? "block" : "none";
    });
});

/* ─── SYNC ON LOAD ─── */
syncAllToggles();
chapterNames.forEach((_, i) => updateProgress(i));

</script>
